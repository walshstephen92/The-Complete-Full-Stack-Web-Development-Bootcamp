<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    
    /* Red background */
    .flag {
      background-color: firebrick;
      color: white;

      height: 600px;
      width: 900px;

      /*
        position: relative
        ------------------
        Two effects, one on .flag itself and one on its descendants:

        1. On .flag itself: "relative" means .flag stays in the
           normal document flow exactly where it would have been.
           Without a top/left/right/bottom value, .flag does NOT
           visually move at all. So why bother? See effect #2.

        2. On descendants: setting any non-static position turns
           .flag into a "positioned ancestor". Any descendant that
           uses position: absolute will now measure its top/left
           from the edges of .flag instead of from the viewport.
           That's what makes the blue stripe sit inside the flag
           rather than floating off relative to the whole page.
      */
      position: relative;
    }

    /* Blue stripe */
    .flag > div {
      background-color: navy;
      color: black; /* Overrides the white color set in the red background div */

      height: 300px;
      width: 900px;

      /*
        position: absolute
        ------------------
        Removes this element from the normal document flow — other
        elements act as if it isn't there — and lets us place it
        precisely with top/left/right/bottom.

        The reference point is the nearest ancestor with a non-static
        position. That's .flag (because we set position: relative on
        it above). So "top: 150px" means 150px down from the top
        edge of .flag.

        Why 150px? The flag is 600px tall and the stripe is 300px
        tall. (600 - 300) / 2 = 150, which centers the stripe
        vertically inside the flag.

        We don't set "left", so it defaults to 0 — the stripe hugs
        the left edge of .flag. That's fine because the stripe is
        the same width as the flag (900px).
      */
      position: absolute;
      top: 150px;
    }

    p {
      text-align: center;
      font-size: 60px;
    }

    /* White circle */
    .flag > div > div {
      background-color: white;

      height: 200px;
      width: 200px;

      border-radius: 50%;

      /*
        position: absolute (again)
        --------------------------
        Same idea as the blue stripe, but the reference point is
        different. The nearest positioned ancestor of THIS div is
        the blue stripe (.flag > div), because that one is also
        position: absolute — and absolute counts as "positioned"
        for this purpose, just like relative does.

        So top/left here are measured from the top-left corner of
        the blue stripe, not from .flag and not from the viewport.

        top: 50px  → (300 - 200) / 2 = 50, centers the 200px circle
                     vertically inside the 300px-tall blue stripe.
        left: 350px → (900 - 200) / 2 = 350, centers it horizontally
                      inside the 900px-wide stripe.
      */
      position: absolute;
      top: 50px;
      left: 350px;
    }

  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
